# ============================================================
# PHASE 4 — BI Layer (Superset)
# RAM estimate: ~768 MB thêm → tổng ~11 GB
# ⚠️  Tắt Spark trước khi bật Superset nếu RAM < 5GB free!
# Start: docker compose -f infra/bi/docker-compose.yml up -d
# ============================================================

name: tcmart-bi

services:

  # ─── Apache Superset ──────────────────────────────────────
  superset:
    image: apache/superset:3.1.0
    container_name: tcmart-superset
    environment:
      SUPERSET_SECRET_KEY: tcmart-superset-secret-2026
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: admin@tcmart.vn
    ports:
      - "8088:8088"
    volumes:
      - superset_data:/app/superset_home
    mem_limit: 768m
    mem_reservation: 512m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  superset_data:
