# ============================================================
# PHASE 1 — Source Databases Only (SQL Server POS)
# RAM estimate: ~1.5 GB
# Start with: docker compose -f infra/sources/docker-compose.yml --profile sources up -d
# ============================================================

name: tcmart-sources

services:

  # ─── Microsoft SQL Server — retail_pos_db (14 tables) ────────
  mssql-source:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tcmart-mssql
    profiles: [sources]
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD:-TCMart@2026!Strong}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./init-scripts/sqlserver:/docker-entrypoint-initdb.d:ro
    mem_limit: 1.5g
    mem_reservation: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$SA_PASSWORD -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── MinIO — Object Storage (Raw Zone) ──────────────
  minio:
    image: minio/minio:latest
    container_name: tcmart-minio
    profiles: [sources]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin2026}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mssql_data:
  minio_data:
