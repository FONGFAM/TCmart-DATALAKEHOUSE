# ============================================================
# PHASE 3 — Lakehouse Layer (ClickHouse + Airflow + FastAPI)
# RAM estimate: ~3.5 GB thêm → tổng ~10 GB
# Start: docker compose -f infra/lakehouse/docker-compose.yml up -d
# ============================================================

name: tcmart-lakehouse

services:

  # ─── ClickHouse — Lakehouse Engine ───────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: tcmart-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tcmart2026}
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"   # HTTP interface
      - "9900:9000"   # Native protocol (dùng 9900 tránh conflict MinIO)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init_bronze.sql:/docker-entrypoint-initdb.d/01_bronze.sql:ro
      - ./clickhouse/init_silver.sql:/docker-entrypoint-initdb.d/02_silver.sql:ro
      - ./clickhouse/init_gold.sql:/docker-entrypoint-initdb.d/03_gold.sql:ro
    mem_limit: 1.5g
    mem_reservation: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Airflow — Orchestration ──────────────────────────────
  airflow:
    image: apache/airflow:2.9.3-python3.10
    container_name: tcmart-airflow
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
      # Giới hạn concurrency để tránh OOM
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
      AIRFLOW__SCHEDULER__MAX_DAGRUNS_TO_CREATE_PER_LOOP: 2
    volumes:
      - ../../src/orchestration/dags:/opt/airflow/dags:ro
      - ../../src/orchestration/plugins:/opt/airflow/plugins:ro
    ports:
      - "8080:8080"
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 0.75
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --password admin
        --firstname Admin --lastname User --role Admin --email admin@tcmart.vn
        && airflow webserver"
    restart: unless-stopped

  # ─── Airflow DB (PostgreSQL riêng) ───────────────────────
  airflow-db:
    image: postgres:15-alpine
    container_name: tcmart-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25
    restart: unless-stopped

  # ─── FastAPI Data Steward ─────────────────────────────────
  data-steward:
    build:
      context: ../../src/steward
      dockerfile: Dockerfile
    container_name: tcmart-steward
    environment:
      DATABASE_URL: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    ports:
      - "8000:8000"
    depends_on:
      - airflow-db
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25
    restart: unless-stopped

volumes:
  clickhouse_data:
  airflow_db_data:
